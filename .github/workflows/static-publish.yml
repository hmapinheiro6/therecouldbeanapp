name: Publish static catalog
on:
  push:
    branches: [main]
    paths:
      - src/**
      - worker/**
      - scripts/**
      - public/**
      - data/categories.json
      - data/expansion-campaign.json
      - data/seeds/published-snapshot.json
      - package*.json
      - wrangler.jsonc
      - .github/workflows/static-publish.yml
  workflow_dispatch:
    inputs:
      blocked_slug:
        description: Optional urgent removed listing (the database remains authoritative)
        default: ""
  workflow_run:
    workflows:
      [
        Expand catalog to 10000,
        Autonomous web and SaaS discovery,
        Build the verified software catalog,
        Process submissions and verification retries,
        Publisher metadata previews,
        Product intelligence,
        Moderate a catalog record,
      ]
    types: [completed]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: static-publication
  cancel-in-progress: false
jobs:
  setup:
    if: github.repository == 'hmapinheiro6/therecouldbeanapp' && github.event.repository.private == false && (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      ready: ${{ steps.access.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check required cloud access without claiming a deployment or backup
        id: access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WATCHDOG_GITHUB_TOKEN: ${{ secrets.WATCHDOG_GITHUB_TOKEN }}
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
        run: node scripts/operations-preflight.mjs deployment
  publish:
    needs: setup
    if: github.repository == 'hmapinheiro6/therecouldbeanapp' && github.event.repository.private == false && (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository) && needs.setup.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WATCHDOG_GITHUB_TOKEN: ${{ secrets.WATCHDOG_GITHUB_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
      INGESTION_API_URL: ${{ vars.INGESTION_API_URL }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require scoped deployment credentials
        run: node scripts/check-deploy-access.mjs
      - run: npm ci
      - name: Apply tracked database migrations
        run: npx wrangler d1 migrations apply DB --remote
      - name: Prepare exact paths still awaiting public removal
        id: blocker
        run: node --import tsx scripts/prepare-blocker.mjs
      - name: Build the current public release with only removal routes added
        if: steps.blocker.outputs.ready == 'true'
        run: npm run build
      - name: Activate temporary 410 responses through the verified deployment path
        if: steps.blocker.outputs.ready == 'true'
        run: npx wrangler deploy --config .ingestion-state/blocker.jsonc
      - name: Export authoritative public records with provider accounting
        run: node scripts/export-published.mjs --remote --release --max-rows 100000
      - name: Build every product page, browser index, sitemap and observations
        run: npm run build
      - name: Verify public static request boundary
        run: node --import tsx scripts/verify-static.mjs
      - name: Install server-only operations credentials
        run: node scripts/install-operations-secrets.mjs
      - name: Lock the matching catalog revision for deployment
        id: lease
        run: python -m ingestion.publication acquire
      - name: Deploy a single atomic static release
        run: npx wrangler deploy
      - name: Verify operations access and initialize fresh account usage
        run: node scripts/verify-operations.mjs
      - name: Release the publication lock
        if: always() && steps.lease.outcome == 'success'
        run: python -m ingestion.publication release
      - name: Persist only the published build input for enrichment jobs
        if: success()
        run: node scripts/publish-expansion.mjs
      - name: Enforce provider rows-read job budget
        if: always()
        run: python -m ingestion.query_usage
