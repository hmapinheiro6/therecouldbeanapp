name: Refresh account usage before hosted work
on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      WATCHDOG_GITHUB_TOKEN:
        required: true
permissions:
  contents: read
jobs:
  refresh:
    if: github.repository == 'hmapinheiro6/therecouldbeanapp' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate cloud access and store current UTC-day usage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WATCHDOG_GITHUB_TOKEN: ${{ secrets.WATCHDOG_GITHUB_TOKEN }}
        run: node scripts/verify-operations.mjs
