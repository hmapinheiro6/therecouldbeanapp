name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    # Public standard runners are free. Do not silently bill a private repository.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_LOG_PATH: .wrangler/logs
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install -r ingestion/requirements.txt -r ingestion/preview-requirements.txt -r ingestion/expansion-requirements.txt
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: python -m pytest tests/ingestion -q
      - run: python scripts/benchmark-query-cost.py
      - run: npm run build
      - run: npm run verify:static
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run benchmark
      - run: npm run benchmark:catalog
