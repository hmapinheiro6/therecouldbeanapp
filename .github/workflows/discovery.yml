name: Daily public product discovery
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: discovery
  cancel-in-progress: false
jobs:
  discover:
    if: github.event.repository.private == false && vars.DISCOVERY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INGESTION_API_URL: ${{ vars.INGESTION_API_URL }}
      INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify configuration
        shell: python
        run: |
          import os
          assert os.environ.get('INGESTION_API_URL', '').startswith('https://'), 'Set the deployed API URL'
          assert len(os.environ.get('INTERNAL_SECRET', '')) >= 32, 'Set the signing secret'
      - name: Discover, verify, publish, persist checkpoints
        run: python -m ingestion.run --max-candidates 100
      # No artifacts: pending submissions and moderation details remain private in D1.
