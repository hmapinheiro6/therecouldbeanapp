name: Process submissions and verification retries
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catalog-writes
  cancel-in-progress: false
jobs:
  discover:
    if: github.event.repository.private == false && vars.DISCOVERY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INGESTION_API_URL: ${{ vars.INGESTION_API_URL }}
      INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify configuration
        shell: python
        run: |
          import os
          assert os.environ.get('INGESTION_API_URL', '').startswith('https://'), 'Set the deployed API URL'
          assert len(os.environ.get('INTERNAL_SECRET', '')) >= 32, 'Set the signing secret'
      - name: Check database allowance and apply tracked migrations
        id: database
        run: python -m ingestion.workflow prepare
      - name: Process pending submissions and verification retries
        if: steps.database.outputs.ready == 'true'
        run: python -m ingestion.workflow discover --queue-only --max-candidates 100
      # No artifacts: pending submissions and moderation details remain private in D1.
      - name: Enforce provider rows-read job budget
        if: always()
        run: python -m ingestion.query_usage
