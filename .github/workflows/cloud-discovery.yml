name: Autonomous web and SaaS discovery
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      candidates:
        description: Maximum new source candidates (1–200)
        default: "100"
      verify:
        description: Maximum official websites to check (0–80)
        default: "80"
      verify_only:
        description: Resume saved queue without collecting new source pages
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: catalog-writes
  cancel-in-progress: false
jobs:
  allowance:
    if: github.event.repository.private == false && github.repository == 'hmapinheiro6/therecouldbeanapp' && vars.DISCOVERY_ENABLED == 'true'
    uses: ./.github/workflows/refresh-usage.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WATCHDOG_GITHUB_TOKEN: ${{ secrets.WATCHDOG_GITHUB_TOKEN }}
  collect:
    needs: allowance
    if: always() && github.event.repository.private == false && github.repository == 'hmapinheiro6/therecouldbeanapp' && vars.DISCOVERY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
      INGESTION_API_URL: ${{ vars.INGESTION_API_URL }}
      GITHUB_TOKEN: ${{ github.token }}
      DURABLE_STATE_BRANCH: "true"
      CANDIDATE_LIMIT: ${{ inputs.candidates || '100' }}
      VERIFY_LIMIT: ${{ inputs.verify || '80' }}
      VERIFY_ONLY: ${{ inputs.verify_only || false }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Restore authenticated encrypted cloud checkpoint
        id: restore
        run: python -m ingestion.cloud_artifacts restore
      - name: Collect and verify independently of database availability
        shell: python
        run: |
          import os, sys
          sys.path.insert(0, os.getcwd())
          from ingestion.cloud_discovery import run
          sys.exit(run(int(os.environ['CANDIDATE_LIMIT']), int(os.environ['VERIFY_LIMIT']), verify_only=os.environ['VERIFY_ONLY'].lower() == 'true'))
      - name: Encrypt durable checkpoint, including interrupted source progress
        id: seal
        if: always() && steps.restore.outcome == 'success'
        run: python -m ingestion.cloud_artifacts seal
      # Current and previous AES-GCM ciphertext live on the isolated state branch.
      - name: Enforce provider rows-read job budget
        if: always()
        run: python -m ingestion.query_usage
