name: Build the verified software catalog
on:
  schedule:
    - cron: "35 */6 * * *"
    - cron: "45 2 * * *"
  workflow_dispatch:
    inputs:
      source:
        type: choice
        description: Licensed source directory
        options: [homebrew, selfhosted]
        default: homebrew
      candidates:
        description: Maximum websites to check (up to 2000)
        default: "100"
        required: true
permissions:
  contents: read
concurrency:
  group: catalog-writes
  cancel-in-progress: false
jobs:
  backfill:
    if: github.event.repository.private == false && vars.DISCOVERY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      INGESTION_API_URL: ${{ vars.INGESTION_API_URL }}
      INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
      DIRECTORY_SOURCE: ${{ inputs.source || (github.event.schedule == '45 2 * * *' && 'selfhosted') || 'homebrew' }}
      CANDIDATE_LIMIT: ${{ inputs.candidates || '100' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply tracked read-budget migration before source work
        run: python -c "from ingestion.client import InternalClient; InternalClient().request('/api/internal/maintenance', {})"
      - name: Verify official websites and publish identity-checked listings
        run: python -m ingestion.backfill --max-candidates "$CANDIDATE_LIMIT" --workers 8 --source "$DIRECTORY_SOURCE"
