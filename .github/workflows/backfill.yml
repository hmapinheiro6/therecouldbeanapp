name: Build the verified software catalog
on:
  schedule:
    - cron: "35 */6 * * *"
    - cron: "45 2 * * *"
  workflow_dispatch:
    inputs:
      source:
        type: choice
        description: Licensed source directory
        options: [homebrew, selfhosted]
        default: homebrew
      candidates:
        description: Maximum websites to check (up to 2000)
        default: "100"
        required: true
permissions:
  contents: read
concurrency:
  group: catalog-writes
  cancel-in-progress: false
jobs:
  allowance:
    if: github.event.repository.private == false && github.repository == 'hmapinheiro6/therecouldbeanapp' && vars.DISCOVERY_ENABLED == 'true'
    uses: ./.github/workflows/refresh-usage.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WATCHDOG_GITHUB_TOKEN: ${{ secrets.WATCHDOG_GITHUB_TOKEN }}
  backfill:
    needs: allowance
    if: github.event.repository.private == false && vars.DISCOVERY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      INGESTION_API_URL: ${{ vars.INGESTION_API_URL }}
      INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
      DIRECTORY_SOURCE: ${{ inputs.source || (github.event.schedule == '45 2 * * *' && 'selfhosted') || 'homebrew' }}
      CANDIDATE_LIMIT: ${{ inputs.candidates || '100' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check database allowance and apply tracked migrations
        id: database
        run: python -m ingestion.workflow prepare
      - name: Verify official websites and publish identity-checked listings
        if: steps.database.outputs.ready == 'true'
        run: python -m ingestion.workflow backfill --max-candidates "$CANDIDATE_LIMIT" --workers 8 --source "$DIRECTORY_SOURCE"
      - name: Enforce provider rows-read job budget
        if: always()
        run: python -m ingestion.query_usage
