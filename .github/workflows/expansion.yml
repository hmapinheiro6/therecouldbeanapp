name: Expand catalog to 10000
on:
  workflow_dispatch:
    inputs:
      audit:
        description: Audit sources without publishing
        type: boolean
        default: true
      checks:
        description: Maximum official websites to check (1–1000)
        default: "1000"
permissions:
  contents: write
  actions: write
concurrency:
  group: catalog-writes
  cancel-in-progress: false
jobs:
  expand:
    if: github.event.repository.private == false && github.repository == 'hmapinheiro6/therecouldbeanapp' && vars.DISCOVERY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
      INGESTION_API_URL: ${{ vars.INGESTION_API_URL }}
      GITHUB_TOKEN: ${{ github.token }}
      DURABLE_STATE_BRANCH: "true"
      AUDIT_ONLY: ${{ inputs.audit == true }}
      CHECK_LIMIT: ${{ inputs.checks || '1000' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install -r ingestion/expansion-requirements.txt
      - name: Restore encrypted hosted checkpoint
        id: restore
        run: python -m ingestion.expansion_artifacts restore
      - name: Check account-wide 70 percent database budget
        id: budget
        if: inputs.audit != true
        run: python -m ingestion.budget
      - name: Collect permitted metadata and verify products
        if: inputs.audit == true || steps.budget.outputs.ready == 'true'
        run: |
          if [ "$AUDIT_ONLY" = "true" ]; then
            python -m ingestion.expansion --audit --limit "$CHECK_LIMIT"
          else
            python -m ingestion.expansion --limit "$CHECK_LIMIT"
          fi
      - name: Record an intentional budget pause
        if: inputs.audit != true && steps.budget.outputs.ready != 'true'
        run: python -m ingestion.expansion_deferred
      - name: Refresh published build input at milestones
        if: success() && inputs.audit != true && steps.budget.outputs.ready == 'true'
        run: python -m ingestion.expansion_snapshot
      - name: Seal durable progress even after a partial run
        id: seal
        if: always() && steps.restore.outcome == 'success'
        run: python -m ingestion.expansion_artifacts seal
      - name: Publish aggregate progress only
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-expansion.mjs
      - name: Continue the dated campaign after its checkpoint is saved
        if: success() && inputs.audit != true && steps.budget.outputs.ready == 'true' && env.CHECK_LIMIT == '1000'
        run: python -m ingestion.expansion_continue
      - name: Enforce provider rows-read job budget
        if: always()
        run: python -m ingestion.query_usage
