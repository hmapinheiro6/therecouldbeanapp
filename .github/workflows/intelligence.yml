name: Product intelligence
on:
  schedule:
    - cron: "11 */2 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum public products to check (1–100)
        default: "100"
permissions:
  contents: write
concurrency:
  group: publisher-enrichment
  cancel-in-progress: false
jobs:
  allowance:
    if: github.event.repository.private == false && github.repository == 'hmapinheiro6/therecouldbeanapp' && vars.DISCOVERY_ENABLED == 'true'
    uses: ./.github/workflows/refresh-usage.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WATCHDOG_GITHUB_TOKEN: ${{ secrets.WATCHDOG_GITHUB_TOKEN }}
  observe:
    needs: allowance
    if: github.event.repository.private == false && github.repository == 'hmapinheiro6/therecouldbeanapp' && vars.DISCOVERY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
      INGESTION_API_URL: ${{ vars.INGESTION_API_URL }}
      OBSERVATION_LIMIT: ${{ inputs.limit || '100' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check account-wide 70 percent database budget
        id: budget
        run: python -m ingestion.budget
      - name: Collect bounded public observations without D1 writes
        if: steps.budget.outputs.ready == 'true'
        run: python -m ingestion.intelligence --limit "$OBSERVATION_LIMIT"
      - name: Publish only public observation files
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add -- public/catalog-intelligence
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh dated product observations'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" pull --rebase origin main
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:main
      - name: Enforce provider rows-read job budget
        if: always()
        run: python -m ingestion.query_usage
