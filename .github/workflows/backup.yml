name: Encrypted full database backup
on:
  schedule:
    - cron: "7 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalog-writes
  cancel-in-progress: false
jobs:
  setup:
    if: github.repository == 'hmapinheiro6/therecouldbeanapp' && github.event.repository.private == false && (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      ready: ${{ steps.access.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check required cloud access without claiming a deployment or backup
        id: access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WATCHDOG_GITHUB_TOKEN: ${{ secrets.WATCHDOG_GITHUB_TOKEN }}
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
        run: node scripts/operations-preflight.mjs backup
  backup:
    needs: setup
    if: github.repository == 'hmapinheiro6/therecouldbeanapp' && github.event.repository.private == false && needs.setup.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
      GITHUB_TOKEN: ${{ github.token }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Export all private data, encrypt, restore-check and store privately in R2
        shell: bash
        run: |
          umask 077
          python -m ingestion.backup create
      # No Actions artifacts, plaintext uploads, tokens, export URLs or SQL in logs.
